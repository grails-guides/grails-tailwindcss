name: Grails 8 CI

on:
  push:
    branches:
      - grails8
  pull_request:
    branches:
      - grails8

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [initial, complete]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew test integrationTest --console=plain --stacktrace
